<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARAGE 36 — Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-center">
  <div class="card login-card">
    <div class="brand-header">
      <h1>GARAGE 36</h1>
      <p>Estacionamiento y Servicios</p>
    </div>
    
    <form id="form-login">
      <div class="form-group">
        <label for="usuario">Usuario / Correo</label>
        <input type="text" id="usuario" value="admin" placeholder="admin" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" value="2026" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Ingresar al Sistema</button>
    </form>
    
    <div id="mensaje-login" class="msg-box msg-error"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
